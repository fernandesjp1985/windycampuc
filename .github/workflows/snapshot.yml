name: Captura Snapshot Pucariço

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Capturar Snapshot via RTSP
        env:
          RTSP_URL: ${{ secrets.RTSP_STREAM_URL }}
        run: |
          ffmpeg -rtsp_transport tcp -y -i "$RTSP_URL" -vframes 1 -q:v 2 snapshot.jpg

      - name: Guardar e Publicar Imagem
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshot.jpg
          git diff --quiet && git diff --staged --quiet || (git commit -m "Atualizar snapshot [skip ci]" && git push)
