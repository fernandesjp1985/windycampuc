name: Captura Snapshot Pucariço com Meteorologia

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar Dependências (FFmpeg, jq, bc, Fontes)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq bc curl fonts-dejavu-core

      - name: Obter Dados da Estação (WU em ºF e converter para ºC)
        run: |
          STATION_ID="ISOBREIR3"
          API_KEY="9980e88c4b6f437280e88c4b6f4372c2"
          
          RESP=$(curl -s "https://api.weather.com/v2/pws/observations/current?stationId=${STATION_ID}&format=json&units=e&apiKey=${API_KEY}")
          TEMP_F=$(echo "$RESP" | jq -r '.observations[0].imperial.temp // empty')
          
          if [ -n "$TEMP_F" ]; then
            TEMP_C=$(printf "%.1f" $(echo "scale=4; ($TEMP_F - 32) * 5 / 9" | bc -l))
            echo "TEMP_STR=${TEMP_C} °C" >> $GITHUB_ENV
          else
            echo "TEMP_STR=--.- °C" >> $GITHUB_ENV
          fi

      - name: Capturar Snapshot e Cobrir Carimbo
        env:
          RTSP_URL: ${{ secrets.RTSP_STREAM_URL }}
        run: |
          export TZ="Europe/Lisbon"
          HORA=$(date +'%d-%m-%Y %H\:%M\:%S')
          BANNER="PUCARIÇO | $HORA | $TEMP_STR"
          
          ffmpeg -rtsp_transport tcp -y -i "$RTSP_URL" \
            -vf "drawbox=x=0:y=0:w=iw:h=110:color=black:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='$BANNER':fontcolor=white:fontsize=48:x=(w-text_w)/2:y=(110-text_h)/2" \
            -vframes 1 -q:v 2 snapshot.jpg

      - name: Guardar Snapshot e Acionar Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshot.jpg
          git diff --quiet && git diff --staged --quiet || (git commit -m "Atualizar snapshot.jpg" || exit 0)
          git pull --rebase origin main
          git push origin main
